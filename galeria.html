<!-- IMAGEN AGRANDADA -->
<div id="visor-imagen" class="visor-imagen">
    <span class="cerrar-visor">&times;</span>
    <img id="imagen-grande" src="" alt="Imagen ampliada">
</div>

<script>
    const imagenes = document.querySelectorAll(".galeria-imagenes img");
    const visor = document.getElementById("visor-imagen");
    const imagenGrande = document.getElementById("imagen-grande");
    const cerrar = document.querySelector(".cerrar-visor");

    imagenes.forEach(function(imagen) {
        imagen.addEventListener("click", function() {
            imagenGrande.src = imagen.src;
            visor.style.display = "flex";
        });
    });

    cerrar.addEventListener("click", function() {
        visor.style.display = "none";
    });

    visor.addEventListener("click", function(evento) {
        if (evento.target === visor) {
            visor.style.display = "none";
        }
    });
</script>
